<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>2人対戦テスト</title>
<!-- 1台のPCで「ふたりで対戦」を試すためのページ。左右それぞれクリックしてから操作する -->
<style>
  html,body{margin:0;height:100%;background:#000;color:#ccc;font:12px sans-serif}
  body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:2px}
  p{grid-column:1/-1;margin:0;padding:4px 8px}
  iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<p>左＝ホスト役、右＝ゲスト役。操作したい側の画面を一度クリックしてからキーを押してください。</p>
<iframe id="a" src="../index.html?debug" title="プレイヤー1"></iframe>
<iframe id="b" src="../index.html?debug" title="プレイヤー2"></iframe>
</body>
</html>
